# Install to /etc/postgresql/18/main/conf.d/fiscus.conf, then restart
# postgresql@18-main (deploy/README.md, step 3).
#
# PRD 5.3 gives PostgreSQL 200 MB of the 1 GB host: 160 MB of shared buffers
# and 20 connections, the limits Apion ran with. They are what keeps the host
# out of the OOM killer, not tuning preferences. While Apion still shares the
# cluster (A-01), its apion.conf sets the same values.

shared_buffers = 160MB
max_connections = 20
work_mem = 4MB
maintenance_work_mem = 32MB
autovacuum_max_workers = 1

# One vCPU: parallel workers would only add memory.
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
jit = off

# The API's pool sets these per connection too (libs/db); here they also
# cover psql and anything else. The migration runner turns the statement
# timeout off for its own session.
statement_timeout = 15s
idle_in_transaction_session_timeout = 30s

# NFR-08: PostgreSQL listens on localhost only.
listen_addresses = 'localhost'
