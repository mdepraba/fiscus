name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Bun version comes from "packageManager" in package.json (tech-stack follow-up 2).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Nx runs on Node (tech-stack: Node 24).
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - run: bun x biome ci .

      - run: bun x nx affected -t typecheck test
