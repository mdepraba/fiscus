# The development and test database only. Production runs PostgreSQL 18 under
# systemd (deploy/), because Docker does not start on the LXC host (PRD 1.3).
#
#   docker compose up -d postgres
name: fiscus

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fiscus
      POSTGRES_PASSWORD: fiscus
      POSTGRES_DB: fiscus
    # Loopback only, as in production (NFR-08).
    ports:
      - 127.0.0.1:5432:5432
    # The PostgreSQL 18 image keeps its data under /var/lib/postgresql/18.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fiscus -d fiscus]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
